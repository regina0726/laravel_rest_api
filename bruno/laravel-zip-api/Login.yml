info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{url}}/login"
  body:
    type: json
    data: |-
      {
        "email": "userbr@example.com",
        "password": "1234"
      }
  auth:
    type: bearer
    token: ""

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("token", res.body.token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
