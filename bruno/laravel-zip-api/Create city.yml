info:
  name: Create city
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:8000/api/cities
  body:
    type: json
    data: '{ "name": "Vác", "county_id": 1 }'
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  variables:
    - name: url
      value: http://localhost:8000/api

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
